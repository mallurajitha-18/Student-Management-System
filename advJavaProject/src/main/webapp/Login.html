<!DOCTYPE html>
   <html>
    <head>
    <meta charset="UTF-8">
    <title>Insert title here</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	  <style>
	  body{
	  background-color:orange;
	   height: 100vh;
       display: flex;
        justify-content: center;
        align-items: center;
	  }
	   .container {
            max-width: 400px;
            width: 100%;
            background: white;
            padding: 30px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }
		h2{
		display:flex;
		justify-content: center;
        align-items: center;
		margin-bottom:20px;
		color:red;
		}
		.container-fluid {
      padding: 16px;
      }
	  label {
            font-weight: bold;
        }
		 a.signup {
            display: inline;
            text-align: right;
            margin-top: 10px;
        }
		p{
		display:inline;
		}
		a{
		display:block;
		margin-top:10px;
		}
	  
	  </style>
	</head>
	<body>
	<div class="container mt-5">
	   <div class="card p-4">
	     
	      <h2> LOGIN FORM </h2>
		 
		  <form name="LOGIN" method="post"  action="signin">
		  <div class="row mb-3">
		     <div class="col mb-3">
			    <label for ="username"> USERNAME</label>
			<input type="text" class="username" id="username" placeholder="username">
			       <span id="usernameError"></span>
			</div>
			   </div>
			   <div class="row mb-3">
		     <div class="col mb-3">
			    <label for ="password"> PASSWORD</label>
			<input type="password" class="password" id="password" placeholder="password">
			       <span id="passwordError"></span>
				   
				  <a href="#">FORGOT PASSWORD </a>
				  
			</div>
			 <button type="submit" class="btn btn-primary"id="login" >SIGN IN</button>
			   </div>
		<p>Don't have an account? <a class="signup" href="#">SIGN UP</a></p>

			   </form>
			</div>
			</div>
			</div>
	
    

    </body>
    </html>
